name: 'Build'

# The default branch is `main`. This previously targeted `master`, which meant
# the workflow never ran.
on:
  push:
    branches:
      - main
    paths-ignore: &card-ignore
      - 'docs/**'
      - 'tests/**'
      - 'assets/**'
      - '.devcontainer/**'
      - '.vscode/**'
      - 'README.md'
      - 'README_CN.md'
      - 'DIY.md'
      - 'DIY_CN.md'
      - 'AGENTS.md'
      - 'CLAUDE.md'
      - 'LICENSE'
      - 'lovelace-example.yaml'
      - 'lovelace-fusion-example.yaml'
      - '.github/ISSUE_TEMPLATE/**'
      - '.github/FUNDING.yml'
  pull_request:
    branches:
      - main
    paths-ignore: *card-ignore

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Lint, test and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build
