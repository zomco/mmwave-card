name: Release

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build-and-upload:
    name: Build & Upload to Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: "npm"
      - run: npm ci
      - run: npm run build
      - uses: softprops/action-gh-release@v3
        with:
          files: dist/mmwave-card.js
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}